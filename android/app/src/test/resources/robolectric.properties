# Robolectric runs the real Android framework on this machine's JVM. SDK 33 matches
# minSdk, so the tests exercise the oldest platform Scribe supports rather than the
# newest one that happens to be installed.
sdk=33

# Conscrypt's native library is published for x86-64 only, and this build host is
# aarch64. Scribe's tests never exercise TLS — the app has no network code under test —
# so the JDK's own security providers are enough and Conscrypt is switched off rather
# than the whole suite being unavailable on this machine.
conscryptMode=OFF
