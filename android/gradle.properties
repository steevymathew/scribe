org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.java.home=/home/steevy/.jdks/temurin-17
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# ARM64 Linux host: Google publishes aapt2 as an x86-64 binary only, which cannot execute
# here, so the build needs an override. Two exist on this machine and the more capable one
# wins: ~/.gradle/gradle.properties points at a natively built aarch64 aapt2 in
# ~/.android-arm-tools/, and a user-level gradle.properties takes precedence over this
# file. The path below is the portable fallback — a qemu-user shim around the SDK's own
# x86-64 binary — for a machine that has no native build. Removing both breaks the build.
android.aapt2FromMavenOverride=/home/steevy/Development/claude/Scribe/android/tools/qemu-x86/aapt2

kotlin.code.style=official
